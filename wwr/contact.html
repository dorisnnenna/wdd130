<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting </title>
    <meta name="description"
      content="Contact Whitewater rafting for inquiries, reservations, and feedback.Reach us easily through our contact form.">
    <meta name="author" content="Doris Nnenna">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/whitewater-design.png" alt="The company Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h1>Contact Us</h1>

        <section class="contact-info">
            <p><strong>Address:</strong> 123 River Lane, Adventure City</p>
            <p><strong>Phone:</strong> +234 800 123 4567</p>
            <p><strong>Email:</strong> info@rafting.com</p>
        </section>

        <section class="map">
            <iframe
              src="
              https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d63432.56131355196!2d3.4340269!3d6.45367405!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1775779109723!5m2!1sen!2sng"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>">
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee-profile-picture1.jpg" alt="Manager">
                <figcaption>Doris Nnenna - Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee-profile-picture2.jpg" alt="Guide">
                <figcaption>Jane Smith - Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee-profile-picture3.jpg" alt="Support Staff">
                <figcaption>Amaka Brown - Support Staff</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message:</p>

                <input type="radio" id="general" name="purpose" value="general">
                <label for="general">General Inquiry</label>

                <input type="radio" id="reservation" name="purpose" value="reservation">
                <label for="reservation">Reservation Question</label>

                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                <label for="suggestion">Website Suggestion</label>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">Please subscribe me to the monthly newsletter</label>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>


    <footer>
        <p>&copy; 2026, Whitewater Rafting Company, Doris Nnenna Amuji.</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-image.webp" alt="Facebook logo">
            </a>

            <a href="https://whatsapp.com">
                <img src="images/whatsapp-image.png" alt="WhatsApp logo">
            </a>

            <a href="https://youtube.com">
                <img src="images/youtube-image.jpg" alt="YouTube logo">
            </a>

        </nav>
    </footer>

</body>

</html>
